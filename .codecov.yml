coverage:
  parsers:
    javascript:
      enable_partials: yes
    gcov:
      branch_detection:
        conditional: yes
        loop: yes
        method: no
        macro: no
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true

ignore:
  - "*.test.ts"
  - "*.test.js"
  - "test/**/*"
  - "scripts/**/*"

comment:
  layout: "reach, diff, flags, files"
